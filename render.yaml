services:
  - type: worker
    name: al3ame-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: al3ame-bot-session
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_NAME
        value: AL3AME BOT
      - key: PREFIX
        value: "."
      - key: AUTH_DIR
        value: /var/data/auth_info_baileys
      - key: LOG_LEVEL
        value: info
      - key: OWNER_NUMBER
        sync: false
